{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Anon is a secure and anonymous messenger platform where you can express yourself freely without revealing your identity.">
    <meta name="keywords" content="anonymous chat, secure messaging, private messenger, anon, no login messaging">
    <meta name="author" content="Justin Chinonso">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'main/favicon-96x96.png' %}" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="{% static 'main/favicon.svg' %}" />
    <link rel="shortcut icon" href="{% static 'main/favicon.ico' %}" />
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'main/apple-touch-icon.png' %}" />
    <meta name="apple-mobile-web-app-title" content="Anon" />
    <link rel="manifest" href="{% static 'main/site.webmanifest' %}" />
    <title>Anon | Anonymous Messenger</title>
</head>
<body>
    {% block content %}{% endblock %}
    <script>
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register("{% static 'main/sw.js' %}")
              .then(function(registration) {
                console.log('Service Worker registered with scope:', registration.scope);
              }, function(err) {
                console.log('Service Worker registration failed:', err);
              });
          });
        }
      </script>
</body>
</html>
